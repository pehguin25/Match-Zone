<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Match Zone</title>
        <style>
            body { background-color: #222; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
            #info { margin-bottom: 15px; padding: 10px; background: #333; border-radius: 8px; width: 730px; display: flex; justify-content: space-between; align-items: center; }
            
            #game-container {
                display: grid;
                grid-template-columns: repeat(23, 30px);
                grid-template-rows: repeat(15, 30px);
                gap: 2px;
                background: #444; 
                padding: 10px;
                border-radius: 4px;
                user-select: none;
            }

            .cell {
                width: 30px;
                height: 30px;
                border: 1px solid #555;
                cursor: pointer;
                box-sizing: border-box;
                position: relative; /* 確保 z-index 生效 */
            }

            .block { border-radius: 4px; z-index: 2; }

            #wrapper { position: relative; display: inline-block; border: 5px solid #333; border-radius: 8px; }

            #start-screen {
                position: absolute;
                top: 0; left: 0; width: 100%; height: 100%;
                background: rgba(0, 0, 0, 0.85);
                display: flex; justify-content: center; align-items: center;
                z-index: 10; border-radius: 4px;
            }

            #start-btn, #reset-btn {
                padding: 10px 25px; font-size: 18px;
                background-color: #4CAF50; color: white;
                border: none; border-radius: 5px; cursor: pointer;
            }

            /* --- 核心修正：動畫期間絕對不能擋住點擊 --- */
            @keyframes pop-out {
                0% { transform: scale(1); opacity: 1; }
                100% { transform: scale(0); opacity: 0; }
            }
            .cell.eliminating {
                animation: pop-out 0.4s forwards;
                pointer-events: none !important; /* 強制穿透，讓下方格子可被點擊 */
                z-index: 1;
            }

            .guide-line { position: absolute; z-index: 5; pointer-events: none; }
            .line-h { border-top: 3px dotted rgba(255, 255, 255, 0.8); }
            .line-v { border-left: 3px dotted rgba(255, 255, 255, 0.8); }

            .hidden { display: none !important; }
            /* 讓 wrapper 變成相對定位，方便線條定位 */
            #wrapper {
                position: relative;
                display: inline-block;
                border: 5px solid #333;
                border-radius: 8px;
                overflow: hidden; /* 防止線條跑出去 */
            }

            /* 1. pop-out 動畫 CSS */
            @keyframes pop-out {
                0% { transform: scale(1); opacity: 1; }
                100% { transform: scale(0); opacity: 0; }
            }

            .cell.eliminating {
                animation: pop-out 0.4s forwards;
                /* 核心修正：動畫播放時不阻擋滑鼠，確保下一次點擊能穿透此格 */
                pointer-events: none !important; 
                z-index: 1; /* 動畫時 z-index 降低 */
            }

            /* 2. 圓形虛線引導線樣式 */
            .guide-line {
                position: absolute;
                z-index: 5;
                pointer-events: none; /* 線條必須透明不影響點擊 */
                background-color: transparent;
            }
            /* 水平虛線 */
            .line-h {
                border-top: 4px dotted rgba(255, 255, 255, 0.9); /* 白色圓點虛線 */
            }
            /* 垂直虛線 */
            .line-v {
                border-left: 4px dotted rgba(255, 255, 255, 0.9); /* 白色圓點虛線 */
            }
        </style>
    </head>
    <body>
        <div id="info">
            <div>
                <span id="timer">剩餘時間: 120s</span>
                <span style="margin-left: 15px;" id="score">得分: 0</span>
            </div>
            <button id="reset-btn">重置遊戲</button>
        </div>
        <div id="wrapper">
            <div id="game-container"></div>
            <div id="start-screen">
                <button id="start-btn">開始遊戲</button>
            </div>
        </div>
        <script src="renderer.js"></script>
    </body>
</html>
